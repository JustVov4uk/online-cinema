[tool.poetry]
name = "onlinecinema"
version = "0.1.0"
description = ""
authors = ["JustVov4uk <volodabudzan4@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.136.3"
uvicorn = "^0.49.0"
pydantic-settings = "^2.14.1"
sqlalchemy = "^2.0.51"
asyncpg = "^0.31.0"
alembic = "^1.18.4"


[tool.poetry.group.dev.dependencies]
pytest = "^9.1.0"
httpx = "^0.28.1"
ruff = "^0.15.17"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
