services:
  app:
    build:
      context: .
    container_name: online_cinema_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://online_cinema:online_cinema_password@db:5432/online_cinema
      ALEMBIC_DATABASE_URL: postgresql+psycopg://online_cinema:online_cinema_password@db:5432/online_cinema
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrator:
    build:
      context: .
    container_name: online_cinema_migrator
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://online_cinema:online_cinema_password@db:5432/online_cinema
      ALEMBIC_DATABASE_URL: postgresql+psycopg://online_cinema:online_cinema_password@db:5432/online_cinema
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: online_cinema_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - online_cinema_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U online_cinema -d online_cinema"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: online_cinema_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - online_cinema_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  online_cinema_postgres_data:
  online_cinema_redis_data:
