services:
  app:
    build:
      context: .
    container_name: online_cinema_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://online_cinema:online_cinema_password@db:5432/online_cinema
      ALEMBIC_DATABASE_URL: postgresql+psycopg://online_cinema:online_cinema_password@db:5432/online_cinema
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_BASE_URL: http://localhost:9000/online-cinema-media
    ports:
      - "8000:8000"
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
      minio_setup:
        condition: service_completed_successfully

  celery_worker:
    build:
      context: .
    container_name: online_cinema_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://online_cinema:online_cinema_password@db:5432/online_cinema
      ALEMBIC_DATABASE_URL: postgresql+psycopg://online_cinema:online_cinema_password@db:5432/online_cinema
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_BASE_URL: http://localhost:9000/online-cinema-media
    command: ["celery", "-A", "src.core.celery_app", "worker", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
      minio_setup:
        condition: service_completed_successfully

  celery_beat:
    build:
      context: .
    container_name: online_cinema_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://online_cinema:online_cinema_password@db:5432/online_cinema
      ALEMBIC_DATABASE_URL: postgresql+psycopg://online_cinema:online_cinema_password@db:5432/online_cinema
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command:
      [
        "celery",
        "-A",
        "src.core.celery_app",
        "beat",
        "--loglevel=info",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    depends_on:
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  migrator:
    build:
      context: .
    container_name: online_cinema_migrator
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://online_cinema:online_cinema_password@db:5432/online_cinema
      ALEMBIC_DATABASE_URL: postgresql+psycopg://online_cinema:online_cinema_password@db:5432/online_cinema
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: online_cinema_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - online_cinema_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U online_cinema -d online_cinema"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: online_cinema_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - online_cinema_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: online_cinema_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    container_name: online_cinema_minio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-online_cinema_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-online_cinema_minio_password}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - online_cinema_minio_data:/data

  minio_setup:
    image: minio/mc:latest
    container_name: online_cinema_minio_setup
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-online_cinema_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-online_cinema_minio_password}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-online-cinema-media}
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done && mc mb --ignore-existing local/$$S3_BUCKET_NAME && mc anonymous set download local/$$S3_BUCKET_NAME",
      ]
    depends_on:
      minio:
        condition: service_started

volumes:
  online_cinema_postgres_data:
  online_cinema_redis_data:
  online_cinema_minio_data:
